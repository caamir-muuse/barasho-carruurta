# Records the play lessons' own lines (Somali, Ubax and Muuse voices) and
# publishes them in media/play/, where the app downloads them.
# One-off: tools/deploy_web.sh clears .github/ on the next web deploy.
name: Record play lesson lines

on:
  push:
    paths:
      - ".github/play-audio/**"
      - ".github/workflows/play-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency: play-audio

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg and the voice client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm install --no-save --no-audit --no-fund --prefix .github/play-audio msedge-tts@2.1.0

      - name: Record
        env:
          ONLY: lesson
        # Whatever was recorded is published even if some lines failed; run
        # the workflow again to record the rest.
        run: node .github/play-audio/tools/generate_play_audio.mjs media/play || true

      - name: Publish
        run: |
          git config user.name "caamir-muuse"
          git config user.email "167996882+caamir-muuse@users.noreply.github.com"
          git add media/play
          git commit -q -m "Play lesson lines $(date +%Y-%m-%d)" || { echo "nothing new"; exit 0; }
          git push
          echo "published $(ls media/play/ubax | wc -l) ubax and $(ls media/play/muuse | wc -l) muuse lines"
