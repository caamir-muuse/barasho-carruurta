<!DOCTYPE html>
<html lang="so">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/barasho-carruurta/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Koritaan — barashada carruurta Soomaaliyeed: Soomaali, Ingiriisi, Carabi, Diin iyo Qur'aan.">
  <meta name="theme-color" content="#247976">
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Koritaan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Koritaan</title>
  <link rel="manifest" href="manifest.json">

  <!--
    What a visitor sees while the app itself is still downloading. Without it
    the page is plain white for as long as the bundle takes to arrive, which
    on the connections this app is used over is long enough to give up on.
    flutter_bootstrap.js fades it out once the app has drawn.
  -->
  <style>
    :root {
      --splash-bg: #FDF8EE;
      --splash-ink: #292521;
      --splash-note: #6B645C;
      --splash-ring: #247976;
      --splash-track: #E7DCCF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --splash-bg: #1C1916;
        --splash-ink: #F5F1EA;
        --splash-note: #A39B90;
        --splash-ring: #4FB3AE;
        --splash-track: #2F2A25;
      }
    }
    html, body { height: 100%; margin: 0; }
    body { background: var(--splash-bg); }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--splash-bg);
      color: var(--splash-ink);
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      transition: opacity 0.4s ease;
      z-index: 10;
    }
    #splash.splash-hide { opacity: 0; pointer-events: none; }
    #splash img {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    }
    #splash .splash-title { font-size: 26px; font-weight: 800; letter-spacing: 0.3px; }
    #splash .splash-ring {
      width: 30px;
      height: 30px;
      margin-top: 6px;
      border: 3px solid var(--splash-track);
      border-top-color: var(--splash-ring);
      border-radius: 50%;
      animation: splash-spin 0.9s linear infinite;
    }
    #splash .splash-note { font-size: 14px; color: var(--splash-note); }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .splash-ring { animation: none; }
      #splash { transition: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="" width="96" height="96">
    <div class="splash-title">Koritaan</div>
    <div class="splash-ring"></div>
    <div class="splash-note">Waa la soo dejinayaa…</div>
  </div>
  <!--
    Keeps the app, and the voices it plays, on the device, so it opens and
    plays with no internet after the first visit (koritaan_sw.js). Registered
    for the base href, the folder the app is published under, once the page
    has loaded, so it never slows the first start. Not Flutter's own
    flutter_service_worker.js, a stub that unregisters itself.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var workers = navigator.serviceWorker;
      // Room to list everything the first start fetched.
      try { performance.setResourceTimingBufferSize(2000); } catch (e) {}

      // On the first visit the engine, fonts and files come before the
      // worker is in charge: the page hands over what it fetched, and the
      // worker keeps what it would have kept.
      function handOver() {
        var worker = workers.controller;
        if (!worker) return;
        var urls = [];
        try {
          performance.getEntriesByType('resource').forEach(function (entry) {
            urls.push(entry.name);
          });
        } catch (e) {}
        worker.postMessage({ type: 'koritaan-loaded', urls: urls });
      }
      workers.addEventListener('controllerchange', handOver);

      window.addEventListener('load', function () {
        workers.register('koritaan_sw.js', {
          scope: document.baseURI,
          updateViaCache: 'none'
        }).then(function (registration) {
          // An app kept open on a home screen is not reloaded for days:
          // it looks for a new build when it comes back to the front.
          var looked = Date.now();
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState !== 'visible') return;
            if (Date.now() - looked < 60 * 60 * 1000) return;
            looked = Date.now();
            registration.update().catch(function () {});
          });
        }).catch(function () {});
        // Once the app has started (the engine comes after the page loads).
        setTimeout(handOver, 15000);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
